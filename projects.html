<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var theme = stored;
  if (!theme) {
    var hour = parseInt(new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hour12: false, timeZone: 'Europe/Berlin' }).format(new Date()), 10);
    theme = (hour >= 19 || hour < 7) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Ella Yuna Jeong</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Ella Yuna Jeong, product designer based in Berlin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #fafaf9;
    --ink: #17171a;
    --line: #e4e3e0;
    --max-w: 640px;
  }

  :root[data-theme="dark"] {
    --bg: #18181b;
    --ink: #f5f5f5;
    --line: rgba(255, 255, 255, 0.18);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1rem;
    line-height: 1.5rem;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: var(--max-w);
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 32px 28px 0;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .theme-toggle:hover {
    transform: scale(1.12);
    opacity: 0.7;
  }

  .theme-toggle .icon-sun { display: none; }

  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline-flex; }

  .site-nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .site-nav a {
    font-size: 15px;
    color: var(--ink);
    text-decoration: none;
    transition: opacity 0.15s ease;
  }

  .site-nav a:not(.home-dot):hover {
    text-decoration: underline;
    text-decoration-color: var(--ink);
    text-underline-offset: 3px;
    opacity: 0.65;
  }

  .site-nav a[aria-current="page"] { font-weight: 600; }

  a.home-dot {
    display: inline-flex;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    outline: 8px solid transparent;
    transition: opacity 0.15s ease, outline-color 0.2s ease;
  }

  .home-dot .dot {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ccccff;
    transition: transform 0.15s ease;
  }

  .home-dot:hover .dot { transform: scale(1.15); }

  .home-dot[aria-current="page"],
  .home-dot:hover {
    outline-color: rgba(255, 255, 0, 0.1);
    outline-offset: 0;
  }

  main {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: var(--max-w);
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 28px;
    text-align: center;
  }

  p {
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 18px;
  }
  p:last-child { margin-bottom: 0; }

  a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease;
  }
  a:hover { text-decoration-color: var(--ink); }

  .contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    margin-bottom: 14px;
  }

  .contact-links a { font-size: 15px; }

  footer {
    max-width: var(--max-w);
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 0 28px 56px;
  }

  footer p { font-size: 15px; opacity: 0.45; margin: 0; }

  @media (max-width: 480px) {
    .site-header { padding: 24px 22px 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="home-dot" aria-label="Home"><span class="dot"></span></a>
    <a href="about.html">About</a>
    <a href="projects.html" aria-current="page">Projects</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
    <span class="icon-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></span>
    <span class="icon-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></span>
  </button>
</header>

<main>
  <p>Coming soon.</p>
</main>

<footer>
  <div class="contact-links">
    <a href="Yuna%20Jeong-Resume.pdf" target="_blank" rel="noopener">CV</a>
    <a href="https://www.linkedin.com/in/ella-yuna-jeong-87500056/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:ellayunaj@gmail.com">ellayunaj@gmail.com</a>
  </div>
  <p>© <span id="year"></span> Ella Yuna Jeong</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.querySelector('.theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  document.querySelectorAll('a[href="index.html"]').forEach(link => {
    link.addEventListener('click', (e) => {
      const current = location.pathname.split('/').pop() || 'index.html';
      if (current === 'index.html') {
        e.preventDefault();
        location.reload();
      }
    });
  });
</script>

</body>
</html>
