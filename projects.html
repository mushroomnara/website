<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Ella Yuna Jeong</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Ella Yuna Jeong, product designer based in Berlin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0b0b0c;
    --ink: #f5f5f5;
    --line: rgba(255, 255, 255, 0.18);
    --max-w: 640px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1rem;
    line-height: 1.5rem;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .site-header {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 32px 28px 0;
  }

  .site-nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .site-nav a {
    font-size: 15px;
    color: var(--ink);
    text-decoration: none;
  }

  .site-nav a:not(.home-dot):hover {
    text-decoration: underline;
    text-decoration-color: var(--ink);
    text-underline-offset: 3px;
  }

  .site-nav a[aria-current="page"] { font-weight: 600; }

  .home-dot {
    display: inline-flex;
    width: 15px;
    height: 15px;
    border-radius: 50%;
  }

  .home-dot .dot {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ccccff;
  }

  .home-dot[aria-current="page"],
  .home-dot:hover {
    outline: 8px solid rgba(255, 255, 0, 0.1);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 28px;
  }

  p {
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 18px;
  }
  p:last-child { margin-bottom: 0; }

  a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease;
  }
  a:hover { text-decoration-color: var(--ink); }

  .contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    margin-bottom: 14px;
  }

  .contact-links a { font-size: 15px; }

  footer {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 28px 56px;
  }

  footer p { font-size: 15px; opacity: 0.45; margin: 0; }

  @media (max-width: 480px) {
    .site-header { padding: 24px 22px 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="home-dot" aria-label="Home"><span class="dot"></span></a>
    <a href="about.html">About</a>
    <a href="projects.html" aria-current="page">Projects</a>
  </nav>
</header>

<main>
  <p>Coming soon.</p>
</main>

<footer>
  <div class="contact-links">
    <a href="mailto:ellayunaj@gmail.com">ellayunaj@gmail.com</a>
    <a href="https://www.linkedin.com/in/ella-yuna-jeong-87500056/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="Yuna%20Jeong-Resume.pdf" target="_blank" rel="noopener">CV</a>
  </div>
  <p>© <span id="year"></span> Ella Yuna Jeong</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.querySelectorAll('a[href="index.html"]').forEach(link => {
    link.addEventListener('click', (e) => {
      const current = location.pathname.split('/').pop() || 'index.html';
      if (current === 'index.html') {
        e.preventDefault();
        location.reload();
      }
    });
  });
</script>

</body>
</html>
